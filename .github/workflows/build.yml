# Her gönderimde testleri çalıştırır ve Windows için tek dosyalık PwRHub.exe üretir.
# Üretilen dosya, GitHub'da ilgili çalıştırmanın "Artifacts" bölümünden indirilir.
#
# Yeni sürüm yayınlamak için pwrhub/__init__.py içindeki sürüm numarasını
# artırıp main dalına gönderin: o numara için henüz yayın yoksa PwRHub.exe
# kendiliğinden deponun "Releases" bölümüne eklenir.
name: Derle ve sına

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # Releases bölümüne dosya ekleyebilmek için

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements-dev.txt pyinstaller
      - name: Testler
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: PwRHub.exe derle
        run: python -m PyInstaller --noconfirm --clean pwrhub.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PwRHub-windows
          path: dist/PwRHub.exe
      - name: Derlenen dosya açılıp kapanabiliyor mu
        shell: pwsh
        env:
          PWRHUB_DATA_DIR: ${{ runner.temp }}\pwrhub-selftest
        run: |
          $p = Start-Process -FilePath dist\PwRHub.exe -ArgumentList "--selftest" -PassThru
          $null = $p.Handle   # çıkış kodu okunabilsin diye tutamacı sakla
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "Zaman aşımı"; exit 1 }
          Write-Host "Çıkış kodu: $($p.ExitCode)"
          Write-Host "--- pwrhub.log ---"
          Get-Content "$env:PWRHUB_DATA_DIR\pwrhub.log" -ErrorAction SilentlyContinue
          exit $p.ExitCode
      - name: Sürümü yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import pwrhub; print(pwrhub.__version__)"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag zaten yayınlanmış; atlanıyor."; exit 0 }
          gh release create $tag dist\PwRHub.exe --target "${{ github.sha }}" `
            --title "PwR Hub $tag" --notes-file docs\surum-notu.md
