[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwrhub"
version = "0.1.0"
description = "Windows için açık kaynaklı oyun başlatıcısı ve performans izleme aracı"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
pwrhub = "pwrhub.app:main"

[tool.setuptools.packages.find]
include = ["pwrhub*"]

[tool.setuptools.package-data]
pwrhub = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
